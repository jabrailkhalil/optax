name: Author cosine wheel October 20
on:
  push:
    branches: [validation/cosine-wheel-oct20]
permissions:
  contents: read
env:
  JAX_PLATFORMS: cpu
jobs:
  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: 5f4554c1533a79933459e8cabdd784fe68237d71
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12'
      - name: Install tooling and build exact production wheel
        run: |
          python -m pip install -q 'jax[cpu]==0.11.2' '.[test]' build pytest pytest-subtests
          python -m build
          python -m pip install --no-deps --force-reinstall dist/*.whl
      - name: Run regression suite from installed wheel, outside source
        run: |
          cd /tmp
          python -c "import optax; print(optax.__file__); assert '/site-packages/' in optax.__file__"
          python -m pytest -q --pyargs optax.losses._regression_test
